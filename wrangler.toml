name = "quotesentry-api"
main = "worker/index.ts"
compatibility_date = "2026-11-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
APP_MODE = "demo"
SEND_MODE = "disabled"

[[d1_databases]]
binding = "DB"
database_name = "quotesentry-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "quotesentry-files"

[[rules]]
type = "Text"
globs = ["**/*.txt", "**/*.csv"]
fallthrough = true

[observability]
enabled = true
